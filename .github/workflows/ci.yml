name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check Rust formatting and production size
        run: python3 tools/rust_hygiene/check.py

      - name: Check locked dependencies
        run: cargo check --locked

      - name: Install contract extraction dependencies
        run: python3 -m pip install -r tools/test_migration_audit/requirements.txt

      - name: Test Python verification tooling
        run: |
          (cd tools/test_migration_audit && python3 -m unittest -v)
          (cd tools/mini_erp_verifier && python3 -m unittest -v)
          (cd tools/rust_hygiene && python3 -m unittest -v)

      - name: Test production projection and queue behavior
        run: cargo test --locked --lib core::production_map

      - name: Check isolated research benchmark
        run: cargo check --locked --features projection-research --example admin_projection_research

      - name: Check generated HTTP contracts
        run: python3 tools/test_migration_audit/extract_all_contracts.py --check

      - name: Verify production HTTP contracts
        run: python3 tools/mini_erp_verifier/verify.py --json
