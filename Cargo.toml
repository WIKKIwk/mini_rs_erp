[package]
name = "mini_rs_erp"
version = "1.0.0"
edition = "2024"
license = "Apache-2.0"
description = "Accord mini ERP core service."
repository = "https://github.com/WIKKIwk/mini_rs_erp"
readme = "README.md"

[workspace]
members = [
    "crates/mini_rs_apparatus_contract",
    "crates/mini_rs_domain_types",
    "crates/mini_rs_gateway",
    "crates/mini_rs_gscale_domain",
]
default-members = ["."]
exclude = ["third_party/sockudo-ws"]
resolver = "3"

[features]
default = []
mcp-readonly-prototype = []
projection-research = []
sonic-json = ["dep:sonic-rs"]
sonic-json-research = ["sonic-json"]
verification = ["dep:tower"]

[dependencies]
mini_rs_apparatus_contract = { path = "crates/mini_rs_apparatus_contract" }
mini_rs_domain_types = { path = "crates/mini_rs_domain_types" }
mini_rs_gscale_domain = { path = "crates/mini_rs_gscale_domain" }
axum = { version = "0.8" }
sockudo-ws = { version = "=2.0.1", path = "third_party/sockudo-ws", default-features = false, features = ["simd", "fastrand", "tokio-runtime", "axum-integration", "permessage-deflate"] }
async-stream = "0.3"
futures-core = "0.3"
http-body-util = "0.1"
async-trait = "0.1"
argon2 = "0.5"
aes = "0.8"
base64 = "0.22"
bincode = "1.3"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10"
cbc = { version = "0.1", features = ["alloc"] }
data-encoding = "2"
dotenvy = "0.15"
ferogram = { version = "0.6.4", default-features = false }
hmac = "0.12"
hyper = { version = "1.9", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["service", "tokio"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
jsonwebtoken = { version = "10.3", features = ["aws_lc_rs"] }
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"] }
rand = "0.9"
ring = "0.17.14"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sonic-rs = { version = "=0.5.10", optional = true, features = ["sanitize"] }
sha2 = "0.10"
socket2 = "0.6"
sqlx = { version = "0.8", default-features = false, features = ["derive", "postgres", "runtime-tokio-rustls"] }
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "serde", "serde-well-known"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "fs", "io-util", "process", "sync", "time"] }
tower-http = { version = "0.6", features = ["fs", "trace", "compression-gzip"] }
tower = { version = "0.5", features = ["util"], optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
urlencoding = "2"
heed = "0.22.1"
rusqlite = { version = "0.32", features = ["bundled", "collation"] }
webp = "0.3"

[dev-dependencies]
libc = "0.2"
axum = { version = "0.8", features = ["ws"] }
mini_rs_apparatus_contract = { path = "crates/mini_rs_apparatus_contract", features = ["test-support"] }
mini_rs_gscale_domain = { path = "crates/mini_rs_gscale_domain", features = ["test-support"] }
proptest = "1.11.0"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[[bin]]
name = "mini_rs_verifier_harness"
path = "src/bin/mini_rs_verifier_harness.rs"
required-features = ["verification"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[[example]]
name = "mcp_readonly_fixture"
path = "examples/mcp_readonly_fixture.rs"
required-features = ["mcp-readonly-prototype"]

[[example]]
name = "admin_projection_research"
path = "examples/admin_projection_research.rs"
required-features = ["projection-research"]

[[example]]
name = "json_codec_research"
path = "examples/json_codec_research.rs"
required-features = ["sonic-json", "verification"]
